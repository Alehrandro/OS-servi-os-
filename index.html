<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lançamento de OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <span class="tag-dot"></span>
    <h1 id="sectorName" class="sector-name" title="Clique para editar (admin)">CABEÇOTES</h1>
  </div>
  <div class="topbar-right">
    <div class="month-nav">
      <button id="prevMonthBtn" class="icon-btn" title="Mês anterior">‹</button>
      <span id="monthLabel" class="month-label">—</span>
      <button id="nextMonthBtn" class="icon-btn" title="Próximo mês">›</button>
    </div>
    <button id="manageClientsBtn" class="btn-ghost">Clientes</button>
  </div>
</header>

<nav id="weekTabs" class="week-tabs"></nav>

<main id="weekContent" class="week-content"></main>

<button id="fabNewOS" class="fab" title="Criar OS para hoje">
  <span class="fab-plus">+</span>
  <span class="fab-label">Nova OS · hoje</span>
</button>

<!-- Modal: Detalhe / Edição de Serviço -->
<div id="serviceModal" class="modal-overlay hidden">
  <div class="modal">
    <button class="modal-close" data-close>&times;</button>
    <div class="modal-header">
      <span class="modal-eyebrow">Ordem de Serviço</span>
      <div class="client-select-row">
        <select id="svcClientSelect" class="input"></select>
        <input id="svcClientColor" type="color" class="color-input" title="Cor do cliente" />
      </div>
    </div>

    <label class="field-label">Data</label>
    <input id="svcDate" type="date" class="input" />

    <label class="field-label">Descrição do serviço</label>
    <textarea id="svcDescription" class="input textarea" rows="4" placeholder="Ex: Retífica de cabeçote, troca de guias e sedes..."></textarea>

    <label class="field-label">Status</label>
    <div class="status-row">
      <button id="svcStatusDone" class="status-btn status-done" data-status="done">✓ Concluído</button>
      <button id="svcStatusPending" class="status-btn status-pending" data-status="pending">◷ Pendente</button>
      <button id="svcStatusPostponed" class="status-btn status-postponed" data-status="postponed">✕ Adiado</button>
    </div>

    <label class="field-label">Imagens das peças</label>
    <div class="images-toolbar">
      <label class="btn-small file-btn">
        Adicionar imagem
        <input id="svcImageInput" type="file" accept="image/*" multiple hidden />
      </label>
    </div>
    <div id="svcImagesGrid" class="images-grid"></div>

    <div class="modal-footer">
      <button id="svcDeleteBtn" class="btn-danger">Excluir OS</button>
      <button id="svcSaveBtn" class="btn-primary">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal: Nova OS -->
<div id="newOSModal" class="modal-overlay hidden">
  <div class="modal">
    <button class="modal-close" data-close>&times;</button>
    <div class="modal-header">
      <span class="modal-eyebrow">Nova Ordem de Serviço</span>
      <h2 id="newOSDateLabel" class="modal-title">—</h2>
    </div>

    <label class="field-label">Cliente</label>
    <div class="client-select-row">
      <select id="newOSClientSelect" class="input"></select>
      <button id="newOSAddClientBtn" class="btn-small">+ Cliente</button>
    </div>

    <label class="field-label">Descrição do serviço</label>
    <textarea id="newOSDescription" class="input textarea" rows="4" placeholder="Ex: Retífica de cabeçote, troca de guias e sedes..."></textarea>

    <div class="modal-footer">
      <button id="newOSCreateBtn" class="btn-primary">Criar OS</button>
    </div>
  </div>
</div>

<!-- Modal: Gerenciar Clientes -->
<div id="clientsModal" class="modal-overlay hidden">
  <div class="modal">
    <button class="modal-close" data-close>&times;</button>
    <div class="modal-header">
      <span class="modal-eyebrow">Clientes cadastrados</span>
    </div>

    <div class="new-client-row">
      <input id="newClientName" class="input" type="text" placeholder="Nome do cliente" />
      <input id="newClientColor" class="color-input" type="color" value="#d98a3d" />
      <button id="addClientBtn" class="btn-small">Adicionar</button>
    </div>

    <div id="clientsList" class="clients-list"></div>
  </div>
</div>

<!-- Modal: PIN de administrador -->
<div id="pinModal" class="modal-overlay hidden">
  <div class="modal modal-narrow">
    <button class="modal-close" data-close>&times;</button>
    <div class="modal-header">
      <span class="modal-eyebrow">Acesso administrador</span>
      <h2 class="modal-title">Editar nome do setor</h2>
    </div>
    <label class="field-label">PIN de administrador</label>
    <input id="pinInput" class="input" type="password" placeholder="••••" />
    <p id="pinError" class="pin-error hidden">PIN incorreto.</p>
    <div class="modal-footer">
      <button id="pinConfirmBtn" class="btn-primary">Confirmar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
